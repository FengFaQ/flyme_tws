name: Build V3-signed APK

# Pushing to main activates the build automatically; workflow_dispatch allows
# a manual re-run from the Actions tab.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  # Required to create the GitHub Release and upload the signed APK.
  contents: write

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.2'

jobs:
  build:
    name: Assemble + APK Signature Scheme v3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deterministic Gradle install (no wrapper jar committed to the repo).
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      # GitHub-hosted runners already ship an Android SDK. The
      # android-actions/setup-android action calls `sdkmanager tools` (the
      # legacy "tools" package, since removed) and fails on current images,
      # so we use the preinstalled SDK directly instead.
      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Assemble unsigned release APK
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          echo "--- APK outputs ---"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Assert real LSPosed module wiring
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          echo "APK: $UNSIGNED"
          echo "--- module metadata inside APK ---"
          unzip -l "$UNSIGNED" | grep -E 'META-INF/xposed/(java_init.list|module.prop|scope.list)' || {
            echo "::error::LSPosed module metadata missing from APK"; exit 1; }
          echo "--- java_init.list content ---"
          unzip -p "$UNSIGNED" META-INF/xposed/java_init.list
          echo "--- module.prop content ---"
          unzip -p "$UNSIGNED" META-INF/xposed/module.prop
          # The REAL framework API must be compileOnly: its class DEFINITIONS
          # must NOT be in classes.dex. A plain string grep is NOT enough --
          # "Lio/github/libxposed/api/XposedModule;" always appears as a type
          # reference (ModuleMain extends XposedModule). scripts/verify_module.py
          # parses the dex class_defs table and asserts on real definitions.
          python3 scripts/verify_module.py "$UNSIGNED"
          # applicationId assertion from AGP metadata
          META=$(find app/build -name 'output-metadata.json' -print -quit)
          if [ -n "$META" ]; then
            echo "--- applicationId from AGP metadata ---"
            grep -o '"applicationId"[^,]*' "$META" | head -n1
            grep -q 'github.forest.tool.tws.io' "$META" || {
              echo "::error::applicationId is not github.forest.tool.tws.io"; exit 1; }
          fi

      # Prefer a repository-provided signing key when configured; otherwise
      # generate an ephemeral CI keystore so every build still yields a real,
      # installable V3-signed artifact. No private key is ever committed.
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STOREPASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEYPASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using repository signing keystore from secrets."
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "KS_STOREPASS=${SECRET_STOREPASS}" >> "$GITHUB_ENV"
            echo "KS_KEYPASS=${SECRET_KEYPASS}"   >> "$GITHUB_ENV"
            echo "KS_ALIAS=${SECRET_ALIAS}"       >> "$GITHUB_ENV"
          else
            echo "No signing secret configured -> generating an ephemeral CI keystore."
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias flyme_tws \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=FrostTool TWS, OU=AI Generated, O=FrostTool, L=NA, ST=NA, C=CN"
            echo "KS_STOREPASS=android" >> "$GITHUB_ENV"
            echo "KS_KEYPASS=android"   >> "$GITHUB_ENV"
            echo "KS_ALIAS=flyme_tws"   >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          ls -l "$KS"

      # zipalign must run BEFORE apksigner, otherwise v2/v3 blocks are invalidated.
      - name: Zipalign
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::unsigned release APK not found"; exit 1
          fi
          zipalign -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          echo "Aligned: $UNSIGNED"
          echo "UNSIGNED_APK=$UNSIGNED" >> "$GITHUB_ENV"

      - name: Sign with APK Signature Scheme v3
        run: |
          set -euo pipefail
          # minSdk 28 + v3 enabled => apksigner emits a pure v3 signature
          # (it auto-disables v1/v2 as redundant since v3 covers 28+ fully).
          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_STOREPASS" \
            --key-pass "pass:$KS_KEYPASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 28 \
            --out "$GITHUB_WORKSPACE/flyme_tws-v3-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          ls -lh "$GITHUB_WORKSPACE/flyme_tws-v3-signed.apk"

      - name: Verify V3 signature
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/flyme_tws-v3-signed.apk" | tee apksigner-verify.txt
          echo "--- asserting APK Signature Scheme v3 ---"
          # apksigner wording varies across build-tools releases
          # ("v3 scheme", "v3.1 scheme", "(APK Signature Scheme v3)").
          # Accept any v3/v3.1 line whose result is true, but require at least one.
          if ! grep -Ei 'v3(\.1)? scheme.*: true' apksigner-verify.txt; then
            echo "::error::APK Signature Scheme v3 block was not produced"; exit 1
          fi
          echo "V3 signature block confirmed."

      - name: Job summary
        run: |
          set -euo pipefail
          {
            echo "### ✅ V3-signed APK built"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`flyme_tws-v3-signed.apk\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| SDK | compileSdk ${ANDROID_COMPILE_SDK}, build-tools ${ANDROID_BUILD_TOOLS} |"
            echo "| Signature | APK Signature Scheme **v3** (pure v3; v1/v2 omitted as redundant at minSdk 28+) |"
            echo ""
            echo "\`\`\`"
            grep -E '^Verified using v[123]' apksigner-verify.txt || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: flyme_tws-v3-signed
          path: |
            flyme_tws-v3-signed.apk
            apksigner-verify.txt
          if-no-files-found: error
          retention-days: 30

      # Every successful build is published as its own GitHub Release.
      # Tag is derived from the run number so each build gets a unique,
      # immutable version; re-running a run (or workflow_dispatch) is idempotent
      # because gh release create --clobber replaces the same tag's assets.
      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="flyme_tws ${TAG} — V3-signed APK"
          APK="$GITHUB_WORKSPACE/flyme_tws-v3-signed.apk"
          VERIFY="$GITHUB_WORKSPACE/apksigner-verify.txt"

          # Rename the asset with the version so it is unambiguous in Releases.
          ASSET="$GITHUB_WORKSPACE/flyme_tws-${TAG}-v3-signed.apk"
          cp "$APK" "$ASSET"

          {
            echo "## flyme_tws ${TAG}"
            echo ""
            echo "自动构建产物：由 GitHub Actions 在每次成功编译后发布。"
            echo ""
            echo "- **应用包名**：github.forest.tool.tws.io"
            echo "- **签名**：APK Signature Scheme **v3**（纯 v3；minSdk 28+ 下 v1/v2 冗余被省略）"
            echo "- **模块类型**：LSPosed 现代 Xposed API（libxposed 102）模块"
            echo "- **Commit**：${GITHUB_SHA}"
            echo "- **构建**：run #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "### 重要说明"
            echo "- 本项目**完全由 AI 生成**，未经完整人工审计与真机验证，请勿用于主力设备。"
            echo "- 未配置固定签名密钥时，每次 CI 运行都会生成**临时密钥**，不同 Release 的 APK"
            echo "  签名不同、**无法互相覆盖安装**（需先卸载旧版）。如需可覆盖升级，请配置"
            echo "  Secrets（SIGNING_KEYSTORE_BASE64 等）使用固定密钥。"
            echo "- 采用 **AGPL-3.0** 协议。"
            echo ""
            echo "附：apksigner-verify.txt 为签名验证记录。"
          } > "$GITHUB_WORKSPACE/release-notes.md"

          # Idempotent: if the tag already exists (e.g. re-run), replace assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists -> uploading/overwriting assets"
            gh release upload "$TAG" "$ASSET" "$VERIFY" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file "$GITHUB_WORKSPACE/release-notes.md"
          else
            echo "Creating Release $TAG"
            gh release create "$TAG" "$ASSET" "$VERIFY" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
              --target "$GITHUB_SHA"
          fi

          echo "Published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo ""
            echo "### 📦 Release: [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
